<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幸運抽獎</title>
<style>
:root{--ink:#20243a;--muted:#777d91;--accent:#6c63ff;--accent2:#8d85ff;--paper:#fff;--bg:#f3f4ff;--line:#e8e9f4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 10%,#e5e3ff 0,transparent 30%),radial-gradient(circle at 90% 85%,#ffe9f0 0,transparent 28%),var(--bg);padding:32px 16px}
.wrap{max-width:1050px;margin:auto}
header{text-align:center;margin:10px 0 28px}
.eyebrow{display:inline-block;background:#eeedff;color:var(--accent);font-size:12px;font-weight:800;letter-spacing:2px;padding:7px 13px;border-radius:99px}
h1{font-size:clamp(32px,5vw,48px);margin:12px 0 6px;letter-spacing:2px}
.subtitle{color:var(--muted);margin:0}
.layout{display:grid;grid-template-columns: minmax(0,1fr) minmax(0,1.05fr);gap:20px;align-items:start}
.panel{background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.9);border-radius:22px;padding:24px;box-shadow:0 14px 45px rgba(54,57,105,.08)}
.panel h2{font-size:18px;margin:0 0 16px;display:flex;align-items:center;gap:9px}
textarea{width:100%;min-height:210px;resize:vertical;border:1px solid var(--line);border-radius:14px;padding:14px;font:inherit;line-height:1.7;outline:none;background:#fcfcff}
textarea:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #6c63ff18}
.hint{font-size:12px;color:var(--muted);margin:8px 0 14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=number]{width:90px;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit}
button{border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;transition:.18s}
button:hover{transform:translateY(-1px);filter:brightness(1.04)}
button:active{transform:translateY(0)}
.primary{background:var(--accent);color:white;box-shadow:0 7px 18px #6c63ff38}
.secondary{background:#f0efff;color:var(--accent)}
.ghost{background:#f5f6fa;color:#646a7e}
.danger{background:#fff0f1;color:#d44e63}
.stats{display:flex;gap:10px;margin-top:17px}
.stat{flex:1;background:#f7f7ff;border-radius:13px;padding:12px}
.stat strong{display:block;font-size:23px}
.stat span{font-size:12px;color:var(--muted)}
.draw-panel{min-height:100%}
.draw-stage{min-height:255px;border-radius:18px;background:linear-gradient(135deg,#6c63ff,#918aff);color:white;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;position:relative;overflow:hidden}
.draw-stage:before,.draw-stage:after{content:"✦";position:absolute;color:#ffffff38;font-size:70px}
.draw-stage:before{top:12px;left:20px}.draw-stage:after{bottom:8px;right:24px}
.stage-label{font-size:13px;letter-spacing:2px;opacity:.85}
#result{font-size:clamp(30px,5vw,48px);font-weight:900;line-height:1.3;margin:16px 0;overflow-wrap:anywhere}
#stageSub{font-size:13px;opacity:.85}
.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:17px 0}
.count-control{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:14px}
#drawBtn{flex:1;padding:15px;font-size:17px}
.winners-head{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}
.winners-head h3{margin:0;font-size:16px}
#winners{list-style:none;margin:0;padding:0;display:grid;gap:8px}
#winners li{display:flex;align-items:center;gap:10px;background:#fafaff;border:1px solid var(--line);padding:11px 13px;border-radius:12px;animation:pop .25s ease}
.rank{width:27px;height:27px;border-radius:9px;background:#eeedff;color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:12px}
.empty{color:var(--muted);font-size:13px;padding:12px 2px}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
.toast{min-height:18px;color:#d44e63;font-size:13px;margin-top:8px}
@keyframes pop{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.spinning{animation:pulse .18s infinite}
@media(max-width:760px){body{padding:20px 12px}.layout{grid-template-columns:1fr}.panel{padding:19px}.draw-stage{min-height:220px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <span class="eyebrow">LUCKY DRAW</span>
  <h1>🎉 幸運抽獎</h1>
  <p class="subtitle">把好運交給隨機，看看今天誰是幸運兒！</p>
</header>
<main class="layout">
  <section class="panel">
    <h2>📝 參加者名單</h2>
    <textarea id="namesInput" placeholder="每行輸入一位參加者，例如：&#10;王小明&#10;陳小華&#10;林同學"></textarea>
    <p class="hint">每行一位參加者；重複姓名會視為不同的抽獎名額。</p>
    <div class="row" style="margin-bottom:12px">
      <input id="excelFile" type="file" accept=".xlsx,.xls,.csv" style="max-width:100%;font-size:13px">
      <button class="secondary" id="importBtn">匯入 Excel／CSV</button>
    </div>
    <p class="hint">Excel 會讀取第一個工作表的第一欄；每一列代表一張抽獎券，重複姓名會增加中獎機率。若第一列是欄位名稱，匯入後請勾選「略過第一列」。</p>
    <label class="count-control" style="margin:0 0 14px;display:inline-flex">
      <input id="skipHeader" type="checkbox" style="width:auto"> 略過第一列（標題列）
    </label>
    <div class="row">
      <button class="secondary" id="loadBtn">更新名單</button>
      <button class="secondary" id="exportBtn">匯出 Excel</button>
      <button class="ghost" id="sampleBtn">載入範例</button>
      <button class="danger" id="clearBtn">清空</button>
    </div>
    <div class="stats">
      <div class="stat"><strong id="total">0</strong><span>參加人數</span></div>
      <div class="stat"><strong id="remaining">0</strong><span>尚未中獎</span></div>
    </div>
    <div class="toast" id="toast" aria-live="polite"></div>
  </section>
  <section class="panel draw-panel">
    <h2>🎁 開始抽獎</h2>
    <div class="draw-stage" id="stage">
      <div class="stage-label">THE LUCKY WINNER IS</div>
      <div id="result">準備好了嗎？</div>
      <div id="stageSub">加入參加者後，按下抽獎開始</div>
    </div>
    <div class="controls">
      <label class="count-control">抽出人數
        <input id="drawCount" type="number" min="1" value="1">
      </label>
      <button class="primary" id="drawBtn">✨ 開始抽獎</button>
    </div>
    <div class="winners-head">
      <h3>🏆 得獎名單</h3>
      <button class="secondary" id="exportWinnersTextBtn">匯出得獎文字表格</button>
      <button class="primary" id="exportWinnersPngBtn">匯出 PNG 圖片</button>
      <button class="ghost" id="resetWinnersBtn">重設得獎紀錄</button>
    </div>
    <ol id="winners"><li class="empty">目前還沒有得獎者</li></ol>
  </section>
</main>
<p class="note">抽獎結果由此頁面隨機產生；重新整理頁面會重設抽獎資料。</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const $ = id => document.getElementById(id);
let participants = []; // 每個元素代表一張抽獎券；重複姓名會提高機率
let winners = [];
let busy = false;

function updateStats(){
  $('total').textContent = participants.length;
  $('remaining').textContent = participants.length;
}
function showToast(msg=''){ $('toast').textContent = msg; }
function updateWinners(){
  const list = $('winners');
  list.innerHTML = '';
  if(!winners.length){
    const li=document.createElement('li'); li.className='empty'; li.textContent='目前還沒有得獎者'; list.appendChild(li); return;
  }
  winners.forEach((winner,i)=>{
    const li=document.createElement('li');
    li.style.display='grid';
    li.style.gridTemplateColumns='27px minmax(80px, auto) minmax(120px, 1fr)';
    li.style.alignItems='center';
    li.style.gap='10px';
    const rank=document.createElement('span'); rank.className='rank'; rank.textContent=i+1;
    const label=document.createElement('strong'); label.textContent=winner.name;
    const note=document.createElement('input');
    note.type='text';
    note.value=winner.note || '';
    note.placeholder='輸入備註／獎品／領獎狀態';
    note.setAttribute('aria-label', winner.name + ' 的備註');
    note.style.width='100%';
    note.style.minWidth='0';
    note.style.padding='9px 10px';
    note.style.border='1px solid var(--line)';
    note.style.borderRadius='9px';
    note.style.font='inherit';
    note.style.fontSize='13px';
    note.addEventListener('input',()=>{ winners[i].note=note.value; });
    li.append(rank,label,note); list.appendChild(li);
  });
}
function syncTextarea(){
  $('namesInput').value = participants.join('\n');
  updateStats();
}
function loadNames(){
  participants = $('namesInput').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  winners = [];
  syncTextarea(); updateWinners();
  showToast(participants.length ? `已載入 ${participants.length} 張抽獎券；姓名重複越多，中獎機率越高。` : '請先輸入參加者姓名。');
  $('result').textContent='準備好了嗎？';
  $('stageSub').textContent='名單更新完成，祝你好運！';
}
$('loadBtn').addEventListener('click',loadNames);

$('exportBtn').addEventListener('click',()=>{
  // 匯出目前尚未中獎的名單，重複姓名會完整保留。
  if(!participants.length){
    showToast('目前沒有可匯出的剩餘名單。');
    return;
  }
  const rows = [['姓名'], ...participants.map(name=>[name])];
  const fileName = '抽獎剩餘名單_' + new Date().toISOString().slice(0,10);
  if(typeof XLSX !== 'undefined'){
    const worksheet = XLSX.utils.aoa_to_sheet(rows);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, '剩餘名單');
    const winnerRows = [['得獎者', '備註'], ...winners.map(w=>[w.name, w.note || ''])];
    const winnerSheet = XLSX.utils.aoa_to_sheet(winnerRows);
    XLSX.utils.book_append_sheet(workbook, winnerSheet, '得獎名單與備註');
    XLSX.writeFile(workbook, fileName + '.xlsx');
  }else{
    const winnerRows = [['得獎者','備註'], ...winners.map(w=>[w.name, w.note || ''])];
    const csv = '\uFEFF' + [...rows, [], ...winnerRows].map(row=>row.map(value=>'"'+String(value ?? '').replace(/"/g,'""')+'"').join(',')).join('\r\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }
  showToast('已匯出剩餘名單，重複姓名也會完整保留。');
});

$('sampleBtn').addEventListener('click',()=>{
  $('namesInput').value=['王小明','陳小華','王小明','林同學','張雅婷','王小明','李承恩','黃品妤','吳家豪','蔡依庭'].join('\n');
  loadNames();
});
$('clearBtn').addEventListener('click',()=>{
  $('namesInput').value=''; participants=[]; winners=[];
  updateStats(); updateWinners(); showToast('名單已清空。');
  $('result').textContent='準備好了嗎？'; $('stageSub').textContent='加入參加者後，按下抽獎開始';
  $('excelFile').value='';
});

$('exportWinnersTextBtn').addEventListener('click',()=>{
  if(!winners.length){
    showToast('目前沒有得獎名單可以匯出。');
    return;
  }

  // 使用 UTF-8 BOM 的 CSV 純文字格式，可直接用 Excel 開啟或匯入。
  const rows = [
    ['得獎人員', '獎品'],
    ...winners.map(winner=>[winner.name, winner.note || ''])
  ];
  const csv = '\uFEFF' + rows.map(row =>
    row.map(value => '"' + String(value ?? '').replace(/"/g,'""') + '"').join(',')
  ).join('\r\n');

  const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = '得獎名單.csv';
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  showToast('已匯出 Excel 可讀取的得獎名單 CSV 檔案。');
});


$('exportWinnersPngBtn').addEventListener('click',()=>{
  if(!winners.length){
    showToast('目前沒有得獎名單可以匯出。');
    return;
  }

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const width = 1000;
  const padding = 40;
  const tableWidth = width - padding * 2;
  const leftWidth = tableWidth * 0.5;
  const rightWidth = tableWidth - leftWidth;
  const titleHeight = 82;
  const headerHeight = 62;
  const horizontalPad = 22;
  const fontSize = 27;
  const lineHeight = 39;
  const font = `${fontSize}px "Noto Sans TC", "Microsoft JhengHei", sans-serif`;

  // 先依文字換行計算每列高度，讓圖片高度隨得獎人數與備註長度自動調整。
  ctx.font = font;
  function wrapText(text, maxWidth){
    const chars = [...String(text || '')];
    const lines = [];
    let line = '';
    for(const ch of chars){
      if(ch === '\n'){
        lines.push(line);
        line = '';
        continue;
      }
      const test = line + ch;
      if(line && ctx.measureText(test).width > maxWidth){
        lines.push(line);
        line = ch;
      }else{
        line = test;
      }
    }
    lines.push(line);
    return lines.length ? lines : [''];
  }

  const rowData = winners.map(winner=>{
    const nameLines = wrapText(winner.name, leftWidth - horizontalPad * 2);
    const prizeLines = wrapText(winner.note || '', rightWidth - horizontalPad * 2);
    const lineCount = Math.max(nameLines.length, prizeLines.length, 1);
    return {nameLines, prizeLines, height: Math.max(72, lineCount * lineHeight + 30)};
  });

  const totalHeight = padding * 2 + titleHeight + headerHeight
    + rowData.reduce((sum,row)=>sum + row.height,0);
  canvas.width = width;
  canvas.height = totalHeight;

  // 設定高解析度畫布的文字樣式。
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,width,totalHeight);

  // 紫色標題列。
  ctx.fillStyle = '#6c63ff';
  ctx.fillRect(padding,padding,tableWidth,titleHeight);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 34px "Noto Sans TC", "Microsoft JhengHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('得獎名單', width/2, padding + titleHeight/2);

  let y = padding + titleHeight;

  // 欄位標題。
  ctx.fillStyle = '#eeeeFf';
  ctx.fillRect(padding,y,tableWidth,headerHeight);
  ctx.fillStyle = '#171717';
  ctx.font = 'bold 28px "Noto Sans TC", "Microsoft JhengHei", sans-serif';
  ctx.fillText('得獎人員', padding + leftWidth/2, y + headerHeight/2);
  ctx.fillText('獎品', padding + leftWidth + rightWidth/2, y + headerHeight/2);

  // 表格內容與黑色格線。
  y += headerHeight;
  ctx.font = font;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  rowData.forEach((row,index)=>{
    const rowTop = y;
    const centerY = rowTop + row.height/2;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(padding,rowTop,tableWidth,row.height);
    ctx.fillStyle = '#111111';

    const nameStartY = centerY - (row.nameLines.length - 1) * lineHeight/2;
    row.nameLines.forEach((line,i)=>{
      ctx.fillText(line, padding + horizontalPad, nameStartY + i*lineHeight);
    });
    const prizeStartY = centerY - (row.prizeLines.length - 1) * lineHeight/2;
    row.prizeLines.forEach((line,i)=>{
      ctx.fillText(line, padding + leftWidth + horizontalPad, prizeStartY + i*lineHeight);
    });

    ctx.strokeStyle = '#111111';
    ctx.lineWidth = 2;
    ctx.strokeRect(padding,rowTop,tableWidth,row.height);
    y += row.height;
  });

  // 外框與標題／表頭分隔線。
  ctx.strokeStyle = '#111111';
  ctx.lineWidth = 2;
  ctx.strokeRect(padding,padding,tableWidth,totalHeight-padding*2);
  ctx.beginPath();
  ctx.moveTo(padding,padding + titleHeight);
  ctx.lineTo(padding + tableWidth,padding + titleHeight);
  ctx.moveTo(padding,y - rowData.reduce((sum,row)=>sum + row.height,0));
  ctx.lineTo(padding + tableWidth,y - rowData.reduce((sum,row)=>sum + row.height,0));
  ctx.stroke();

  canvas.toBlob(blob=>{
    if(!blob){
      showToast('PNG 圖片產生失敗，請再試一次。');
      return;
    }
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = '得獎名單.png';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    showToast('已下載得獎名單 PNG 圖片。');
  },'image/png');
});

$('resetWinnersBtn').addEventListener('click',()=>{
  showToast('若要重新抽獎，請重新匯入 Excel 或重新載入原始名單。');
});
$('importBtn').addEventListener('click', async ()=>{
  const file = $('excelFile').files[0];
  if(!file){ showToast('請先選擇 Excel 或 CSV 檔案。'); return; }
  try{
    let rows;
    const ext = file.name.split('.').pop().toLowerCase();
    if(ext === 'csv'){
      const text = await file.text();
      rows = text.split(/\r?\n/).map(line => [line.split(',')[0].replace(/^"|"$/g,'').trim()]);
    }else{
      if(typeof XLSX === 'undefined') throw new Error('Excel 讀取元件載入失敗，請確認網路連線後重新整理網頁。');
      const data = await file.arrayBuffer();
      const workbook = XLSX.read(data, {type:'array'});
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      rows = XLSX.utils.sheet_to_json(firstSheet, {header:1, defval:''});
    }
    const startRow = $('skipHeader').checked ? 1 : 0;
    participants = rows.slice(startRow).map(row => String(row[0] ?? '').trim()).filter(Boolean);
    winners = [];
    syncTextarea(); updateWinners();
    showToast(participants.length ? `成功匯入 ${participants.length} 張抽獎券！` : '檔案中第一欄沒有可匯入的姓名。');
    $('result').textContent='名單匯入完成！';
    $('stageSub').textContent='每一列都是一張抽獎券，重複姓名會提高機率';
  }catch(err){
    showToast(err.message || '匯入失敗，請確認檔案格式。');
  }
});
$('drawBtn').addEventListener('click',()=>{
  if(busy) return;
  if(!participants.length){showToast('請先輸入參加者並更新名單。');return;}
  const count=Math.floor(Number($('drawCount').value));
  if(!Number.isFinite(count)||count<1){showToast('抽獎人數至少要是 1 人。');return;}
  const uniqueNames=[...new Set(participants)];
  if(count>uniqueNames.length){showToast(`目前只有 ${uniqueNames.length} 位不同的參加者，無法抽出 ${count} 位不重複得獎者。`);return;}
  busy=true; showToast('');
  const btn=$('drawBtn'); btn.disabled=true; btn.textContent='抽獎中…';
  $('result').classList.add('spinning');

  // 動畫顯示也依照抽獎券數量加權。
  let ticks=0;
  const spin=setInterval(()=>{
    const pick=participants[Math.floor(Math.random()*participants.length)];
    $('result').textContent=pick;
    ticks++;
    if(ticks>=14){
      clearInterval(spin);
      const selected=[];
      const remaining=[...participants];
      while(selected.length<count){
        const chosen=remaining[Math.floor(Math.random()*remaining.length)];
        selected.push(chosen);
        // 中獎者從名單中整個移除，避免同一人再次中獎；
        // 因此該姓名的所有重複抽獎券也會一起移除。
        for(let i=remaining.length-1;i>=0;i--){
          if(remaining[i]===chosen) remaining.splice(i,1);
        }
      }
      winners.push(...selected.map(name=>({name, note:''})));
      participants=remaining;
      syncTextarea();
      updateWinners();
      $('result').textContent=selected.join('、');
      $('stageSub').textContent=count===1?'恭喜這位幸運得主！該姓名已從剩餘名單移除。':`恭喜抽出 ${count} 位得獎者！得獎者已從剩餘名單移除。`;
      $('result').classList.remove('spinning');
      btn.disabled=false; btn.textContent='✨ 再抽一次'; busy=false;
      showToast(`抽獎完成！已移除得獎者；剩餘 ${participants.length} 張抽獎券。`);
    }
  },95);
});
</script>
</body>
</html>
